<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recibos</title>
    <link rel="stylesheet" href="Recibos-style.css">
</head>
<body>
    <div class="Barra-Navegacion">
        <div class="Logo-Ingreso">
            <a href="../ingreso.html" class="Logo-Link">
                <img src="../Images/klipartz.com.png" alt="Ir a ingreso" class="Logo-Imagen">
                <span class="Logo-Tooltip">Ir a ingreso</span>
            </a>
        </div>

        <a href="../Inventario/Inventario.html">
            <button class="Inventario-btn">
                <img src="../Images/klipartz.com (1).png" alt="Inventario" class="Nav-Icon">
                Inventario
            </button>
        </a>
        <a href="../Recibos/Recibos.html">
            <button class="Recibos-btn">
                <img src="../Images/Recibo.png" alt="Recibos" class="Nav-Icon">
                Recibos
            </button>
        </a>
        <a href="../Avisos/Avisos.html">
            <button class="Avisos-btn">
                <img src="../Images/Advertencia.png" alt="Avisos" class="Nav-Icon">
                Avisos
            </button>
        </a>
        <a id="link-usuarios" href="../Usuarios/Usuarios.html">
            <button class="Usuarios-btn">
                <img src="../Images/klipartz.com.png" alt="Usuarios" class="Nav-Icon">
                Usuarios
            </button>
        </a>
    </div>
    <div class="Zona-Tarjetas">
        <div class="Zona-Superior">
            <div class="Botones-Accion">
                <button class="Accion-btn" id="btn-agregar">Agregar</button>
                <button class="Accion-btn" id="btn-eliminar">Eliminar</button>
                <button class="Accion-btn" id="btn-editar">Editar</button>
            </div>
            <input type="text" class="Barra-Busqueda" placeholder="Buscar recibo...">
        </div>
        <div class="Tarjetas-Grid">
            <!-- Cards will be loaded dynamically from database -->
        </div>
    </div>

        <!--aca el modal del boton agregar-->
        <dialog class="card-agregar" id="modal">
            <form class="form-ingreso">
                <div class="nombre-int">
                        <input type="text" placeholder="Valor" class="input-valor">
                </div>
                <div class="nombre-int">
                        <input type="text" placeholder="Fecha" class="input-fecha">
                </div>
                <div class="nombre-int">
                        <input type="text" placeholder="Insumos comprados" class="input-insumos">
                </div>
                <div class="nombre-int">
                        <input type="text" placeholder="Cantidades" class="input-cantidades">
                </div>
                <div class="nombre-int">
                        <input type="text" placeholder="Empleados" class="input-empleados">
                </div>
                    <button type="button" class="btn-agregar" id="modal-add">Agregar</button>
                    <button type="button" id="btnCancelar" class="btn-cancelar">cancelar</button>
            </form>
        </dialog>

    <script src="Recibos-new.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avisos</title>
    <link rel="stylesheet" href="Avisos-style.css">
</head>
<body>
    <button class="nav-toggle" aria-label="Ocultar navegación"><span class="hamburger"></span></button>
    <div class="Barra-Navegacion">
        <div class="Logo-Ingreso">
            <a href="../ingreso.html" class="Logo-Link">
                <img src="../Images/klipartz.com.png" alt="Ir a ingreso" class="Logo-Imagen">
                <span class="Logo-Tooltip">Ir a ingreso</span>
            </a>
        </div>
        <a href="../Inventario/Inventario.html">
            <button class="Inventario-btn">
                <img src="../Images/klipartz.com (1).png" alt="Inventario" class="Nav-Icon">
                Inventario
            </button>
        </a>
        <a href="../Recibos/Recibos.html">
            <button class="Recibos-btn" href="Recibos.html">
                <img src="../Images/Recibo.png" alt="Recibos" class="Nav-Icon">
                Recibos
            </button>
        </a>
        <a href="../Avisos/Avisos.html">
            <button class="Avisos-btn">
                <img src="../Images/Advertencia.png" alt="Avisos" class="Nav-Icon">
                Avisos
            </button>
        </a>
            <a id="link-usuarios" href="../Usuarios/Usuarios.html">
            <button class="Inventario-btn">
                <img src="../Images/klipartz.com.png" alt="Inventario" class="Nav-Icon">
                Usuarios
            </button>
        </a>
    </div>
    <div class="Zona-Tarjetas">
        <div class="Zona-Superior">
            <input type="text" class="Barra-Busqueda" placeholder="Buscar aviso...">
        </div>
        <div class="Tarjetas-Grid">

            <!-- Redundante pero luego me pierdo de donde poner mas tarjetas -->
        </div>
</div>
    <script src="Avisos.js"></script>
        <script>
        (function(){
            const nav = document.querySelector('.Barra-Navegacion');
            if (!nav) return;
            let collapsed = localStorage.getItem('navCollapsed');
            if (collapsed === null) collapsed = 'false';
            const btn = document.querySelector('.nav-toggle');
            if (!btn) return;
            function apply(){
                if (collapsed === 'false'){
                    nav.classList.remove('mobile-collapsed');
                    document.body.classList.add('nav-open');
                } else {
                    nav.classList.add('mobile-collapsed');
                    document.body.classList.remove('nav-open');
                }
            }
            btn.addEventListener('click', function(){
                collapsed = (collapsed === 'true') ? 'false' : 'true';
                localStorage.setItem('navCollapsed', collapsed);
                apply();
            });
            apply();
        })();
        </script>
</body>
</html>
